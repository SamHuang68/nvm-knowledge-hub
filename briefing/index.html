<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="../site-language.js?v=20260917-r4"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An 18-slide technical briefing with speaker notes covering AI accelerators, DDR5 subsystems, TSMC advanced nodes, and specialty-foundry eNVM.">
  <title>Executive Briefing & Speaker Whitepaper · NVM Knowledge Hub</title>
  <link rel="canonical" href="https://samhuang68.github.io/nvm-knowledge-hub/briefing/">
  <link rel="stylesheet" href="../hub.css?v=20260916-keepout">
  <link rel="stylesheet" href="../site-shell.css?v=20260916-keepout">
  <link rel="stylesheet" href="../surface-radius.css?v=20260908">
  <link rel="stylesheet" href="../全站閱讀系統.css?v=20260916-keepout">
  <style>
    [data-lang="zh"] { display: none !important; }
    [data-lang="en"] { display: revert; }
    html[data-language="zh"] [data-lang="zh"], body[data-language="zh"] [data-lang="zh"] { display: revert !important; }
    html[data-language="zh"] [data-lang="en"], body[data-language="zh"] [data-lang="en"] { display: none !important; }
    :root { --hub-keepout: clamp(24px, 4vw, 64px); }
    .briefing-hero { padding: 60px var(--hub-keepout) 36px; text-align: center; max-width: 1080px; margin: 0 auto; }
    .briefing-badge { display: inline-block; font-size: 11px; letter-spacing: 0.18em; color: #c4a574; border: 1px solid rgba(196,165,116,0.25); padding: 5px 12px; margin-bottom: 16px; }
    .briefing-hero h1 { font-size: clamp(26px, 3.8vw, 46px); line-height: 1.25; margin: 0 0 16px; }
    .briefing-hero h1 em { color: #c4a574; font-style: normal; }
    .briefing-actions, .briefing-filter-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 36px; }
    .btn-briefing-action { padding: 10px 18px; font-size: 12px; color: #c4a574; text-decoration: none; border: 1px solid rgba(196,165,116,0.3); }
    .filter-btn { padding: 8px 14px; font-size: 11px; color: #9cb5bc; border: 1px solid rgba(255,255,255,0.12); background: rgba(7,31,44,0.6); }
    .filter-btn.active { background: #c4a574; color: #061b29; }
    .briefing-grid { max-width: 1240px; margin: 0 auto; padding: 0 var(--hub-keepout) 80px; display: grid; gap: 32px; }
    .slide-card { background: #082433; border: 1px solid rgba(196,165,116,0.2); border-radius: 8px; }
    .slide-card.hidden { display: none !important; }
    .slide-card-header { background: #051924; padding: 20px 24px; }
    .slide-card-body { padding: 24px; display: grid; grid-template-columns: 1fr 1.2fr; gap: 28px; }
    @media (max-width: 960px) { .slide-card-body { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="theme-dark">
  <header class="site-header" role="banner">
    <a class="brand" href="../index.html" aria-label="NVM Knowledge Hub home">
      <span class="brand-copy"><strong>NVM</strong><small>KNOWLEDGE HUB</small></span>
      <span class="brand-section">EXECUTIVE BRIEFING</span>
    </a>
    <nav class="primary-nav" id="primaryNav">
      <a href="../index.html#layer-foundations">Technology Foundations</a>
      <a href="../index.html#layer-resources" aria-current="location">Literature and Tools</a>
    </nav>
    <div class="header-actions">
      <button class="language-toggle" id="languageToggle" type="button" aria-label="Switch language"><b data-lang-option="zh">中</b><i>/</i><b data-lang-option="en">EN</b></button>
      <button class="menu-button" id="menuToggle" type="button" aria-label="Open menu" aria-expanded="false"><i></i><i></i></button>
    </div>
  </header>
  <main id="main-content"><p style="padding:24px;color:#9cb5bc;">Loading briefing cards…</p></main>
  <script>
    (async function () {
      const bind = () => {
        document.querySelectorAll('.filter-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
            const filter = btn.dataset.filter;
            document.querySelectorAll('.slide-card').forEach(card => {
              card.classList.toggle('hidden', !(filter === 'all' || card.dataset.filterGroup === filter));
            });
          });
        });
        const printBtn = document.getElementById('btnPrintBriefing');
        if (printBtn) printBtn.addEventListener('click', () => window.print());
        if (window.HubLanguage) window.HubLanguage.set(window.HubLanguage.get(), false);
      };
      const mountHtml = (html) => {
        const mount = document.getElementById('main-content');
        if (html.includes('<main')) mount.outerHTML = html;
        else mount.innerHTML = html;
        bind();
      };
      try {
        const files = ['header.html', 'part-1.html', 'part-2.html', 'part-3.html'];
        const texts = await Promise.all(files.map(name => fetch('./' + name, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(name); return r.text(); })));
        mountHtml(texts.join(''));
        return;
      } catch (err) {
        const SRC = 'https://raw.githubusercontent.com/SamHuang68/nvm-knowledge-hub/11b0143fe2455e791fe974c32dc7f9d33b739e95/briefing/index.html';
        try {
          const html = await fetch(SRC).then(r => { if (!r.ok) throw new Error('raw'); return r.text(); });
          const doc = new DOMParser().parseFromString(html, 'text/html');
          const incomingMain = doc.querySelector('main');
          const incomingStyle = doc.querySelector('head style');
          if (incomingStyle) document.head.appendChild(incomingStyle.cloneNode(true));
          if (incomingMain) document.getElementById('main-content').replaceWith(incomingMain);
          bind();
        } catch (err2) {
          document.getElementById('main-content').innerHTML = '<p style="padding:24px">Briefing cards failed to load. Use the PPTX in the repository briefing folder.</p>';
        }
      }
    })();
  </script>
</body>
</html>
