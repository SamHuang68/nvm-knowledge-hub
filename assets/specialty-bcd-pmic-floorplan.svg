<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="bcd-title bcd-desc">
  <title id="bcd-title">Illustrative BCD PMIC floorplan</title>
  <desc id="bcd-desc">Site-drawn teaching floorplan. Block positions and areas are illustrative, not a named product die and not to scale. Numbers 1 to 6 match the bilingual legend on the page.</desc>
  <defs>
    <pattern id="otp-cells" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="14" height="14" rx="1.5" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="0.8"/>
    </pattern>
    <pattern id="std-cells" width="12" height="18" patternUnits="userSpaceOnUse">
      <rect x="0" y="2" width="12" height="12" fill="#e2e8f0"/>
      <rect x="2" y="4" width="3" height="8" fill="#94a3b8"/>
      <rect x="7" y="4" width="3" height="8" fill="#cbd5e1"/>
    </pattern>
    <marker id="trim-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#6d28d9"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <!-- 晶粒外框與密封環 -->
  <rect x="40" y="36" width="1120" height="603" rx="6" fill="#eef2f6" stroke="#64748b" stroke-width="3"/>
  <rect x="52" y="48" width="1096" height="579" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- 周邊焊墊 -->
  <g fill="#e2e8f0" stroke="#64748b" stroke-width="1.5">
    <rect x="120" y="62" width="44" height="44"/><rect x="240" y="62" width="44" height="44"/><rect x="360" y="62" width="44" height="44"/>
    <rect x="480" y="62" width="44" height="44"/><rect x="600" y="62" width="44" height="44"/><rect x="720" y="62" width="44" height="44"/>
    <rect x="840" y="62" width="44" height="44"/><rect x="960" y="62" width="44" height="44"/><rect x="1080" y="62" width="44" height="44"/>
    <rect x="120" y="569" width="44" height="44"/><rect x="240" y="569" width="44" height="44"/><rect x="360" y="569" width="44" height="44"/>
    <rect x="480" y="569" width="44" height="44"/><rect x="600" y="569" width="44" height="44"/><rect x="720" y="569" width="44" height="44"/>
    <rect x="840" y="569" width="44" height="44"/><rect x="960" y="569" width="44" height="44"/><rect x="1080" y="569" width="44" height="44"/>
    <rect x="62" y="170" width="44" height="44"/><rect x="62" y="290" width="44" height="44"/><rect x="62" y="410" width="44" height="44"/>
    <rect x="1094" y="170" width="44" height="44"/><rect x="1094" y="290" width="44" height="44"/><rect x="1094" y="410" width="44" height="44"/>
  </g>
  <!-- 1 高壓 LDMOS 功率級：交指狀源汲極與匯流排 -->
  <rect x="130" y="130" width="440" height="415" rx="4" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <g fill="#fdba74">
    <rect x="200" y="160" width="350" height="12"/><rect x="200" y="314" width="350" height="12"/>
    <rect x="200" y="356" width="350" height="12"/><rect x="200" y="510" width="350" height="12"/>
  </g>
  <g fill="#fed7aa" stroke="#ea580c" stroke-width="1">
    <rect x="206" y="172" width="12" height="122"/><rect x="244" y="172" width="12" height="122"/><rect x="282" y="172" width="12" height="122"/>
    <rect x="320" y="172" width="12" height="122"/><rect x="358" y="172" width="12" height="122"/><rect x="396" y="172" width="12" height="122"/>
    <rect x="434" y="172" width="12" height="122"/><rect x="472" y="172" width="12" height="122"/><rect x="510" y="172" width="12" height="122"/>
    <rect x="225" y="192" width="12" height="122"/><rect x="263" y="192" width="12" height="122"/><rect x="301" y="192" width="12" height="122"/>
    <rect x="339" y="192" width="12" height="122"/><rect x="377" y="192" width="12" height="122"/><rect x="415" y="192" width="12" height="122"/>
    <rect x="453" y="192" width="12" height="122"/><rect x="491" y="192" width="12" height="122"/><rect x="529" y="192" width="12" height="122"/>
    <rect x="206" y="368" width="12" height="122"/><rect x="244" y="368" width="12" height="122"/><rect x="282" y="368" width="12" height="122"/>
    <rect x="320" y="368" width="12" height="122"/><rect x="358" y="368" width="12" height="122"/><rect x="396" y="368" width="12" height="122"/>
    <rect x="434" y="368" width="12" height="122"/><rect x="472" y="368" width="12" height="122"/><rect x="510" y="368" width="12" height="122"/>
    <rect x="225" y="388" width="12" height="122"/><rect x="263" y="388" width="12" height="122"/><rect x="301" y="388" width="12" height="122"/>
    <rect x="339" y="388" width="12" height="122"/><rect x="377" y="388" width="12" height="122"/><rect x="415" y="388" width="12" height="122"/>
    <rect x="453" y="388" width="12" height="122"/><rect x="491" y="388" width="12" height="122"/><rect x="529" y="388" width="12" height="122"/>
  </g>
  <g fill="#fb923c">
    <rect x="254" y="545" width="16" height="24"/><rect x="374" y="545" width="16" height="24"/><rect x="494" y="545" width="16" height="24"/>
  </g>
  <!-- 2 閘極驅動與位準轉換 -->
  <rect x="590" y="130" width="170" height="190" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <g fill="#bae6fd" stroke="#0284c7" stroke-width="1">
    <rect x="612" y="196" width="56" height="28"/><rect x="682" y="196" width="56" height="28"/>
    <rect x="612" y="236" width="56" height="28"/><rect x="682" y="236" width="56" height="28"/>
    <rect x="612" y="276" width="126" height="22"/>
  </g>
  <!-- 3 能隙基準與修調電路 -->
  <rect x="780" y="130" width="290" height="190" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <polyline points="850,188 862,196 838,206 862,216 838,226 862,236 838,246 862,256 838,266 862,276 850,284" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linejoin="round"/>
  <polyline points="900,188 912,196 888,206 912,216 888,226 912,236 888,246 912,256 888,266 912,276 900,284" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M950 200 L1010 230 L950 260 Z" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
  <g fill="#bbf7d0" stroke="#15803d" stroke-width="1">
    <rect x="940" y="276" width="18" height="18"/><rect x="964" y="276" width="18" height="18"/><rect x="988" y="276" width="18" height="18"/>
    <rect x="1012" y="276" width="18" height="18"/><rect x="1036" y="276" width="18" height="18"/>
  </g>
  <!-- 4 反熔絲 OTP 修調陣列 -->
  <rect x="590" y="340" width="230" height="205" rx="4" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <rect x="640" y="372" width="160" height="140" fill="url(#otp-cells)"/>
  <rect x="610" y="372" width="22" height="140" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1"/>
  <rect x="640" y="520" width="160" height="14" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1"/>
  <!-- 5 數位控制與暫存器 -->
  <rect x="840" y="340" width="230" height="205" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <rect x="860" y="384" width="190" height="144" fill="url(#std-cells)"/>
  <!-- 修調碼載入路徑（示意） -->
  <path d="M705 340 V330 H925 V324" fill="none" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#trim-arrow)"/>
  <path d="M705 330 H675 V324" fill="none" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#trim-arrow)"/>
  <!-- 編號 -->
  <g font-family="IBM Plex Mono, Consolas, monospace" font-size="28" font-weight="700" text-anchor="middle" fill="#0f172a">
    <circle cx="160" cy="160" r="25" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/><text x="160" y="170">1</text>
    <circle cx="616" cy="160" r="25" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/><text x="616" y="170">2</text>
    <circle cx="806" cy="160" r="25" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/><text x="806" y="170">3</text>
    <circle cx="616" cy="368" r="25" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/><text x="616" y="378">4</text>
    <circle cx="866" cy="368" r="25" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/><text x="866" y="378">5</text>
    <circle cx="142" cy="84" r="25" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/><text x="142" y="94">6</text>
  </g>
</svg>
