<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="ddic-title ddic-desc">
  <title id="ddic-title">Illustrative e-paper DDIC floorplan</title>
  <desc id="ddic-desc">Site-drawn teaching floorplan of a long, slim display driver die. Block positions, areas and aspect ratio are illustrative, not a named product die and not to scale. Numbers 1 to 5 match the bilingual legend on the page.</desc>
  <defs>
    <pattern id="driver-channels" width="10" height="84" patternUnits="userSpaceOnUse">
      <rect x="2" y="0" width="6" height="84" fill="#bae6fd"/>
      <rect x="2" y="58" width="6" height="6" fill="#0284c7"/>
    </pattern>
    <pattern id="shifter-cells" width="10" height="20" patternUnits="userSpaceOnUse">
      <rect x="1" y="3" width="8" height="14" fill="#c7d2fe" stroke="#6366f1" stroke-width="0.6"/>
    </pattern>
    <pattern id="lut-cells" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="12" height="12" rx="1.5" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="0.8"/>
    </pattern>
    <pattern id="logic-cells" width="12" height="16" patternUnits="userSpaceOnUse">
      <rect x="0" y="2" width="12" height="10" fill="#e2e8f0"/>
      <rect x="2" y="4" width="3" height="6" fill="#94a3b8"/>
      <rect x="7" y="4" width="3" height="6" fill="#cbd5e1"/>
    </pattern>
    <pattern id="bumps" width="20" height="24" patternUnits="userSpaceOnUse">
      <rect x="4" y="0" width="12" height="24" rx="2" fill="#fde68a" stroke="#b45309" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <!-- 細長晶粒外框與密封環（長寬比為示意） -->
  <rect x="40" y="170" width="1120" height="330" rx="6" fill="#eef2f6" stroke="#64748b" stroke-width="3"/>
  <rect x="50" y="180" width="1100" height="310" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- 5 金凸塊接墊：輸出側整排、輸入側一段 -->
  <rect x="64" y="190" width="1080" height="24" fill="url(#bumps)"/>
  <rect x="330" y="464" width="420" height="24" fill="url(#bumps)"/>
  <!-- 1 高壓源極驅動與位準轉換通道（重複排列） -->
  <rect x="64" y="224" width="1080" height="124" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <rect x="74" y="230" width="1060" height="84" fill="url(#driver-channels)"/>
  <rect x="74" y="320" width="1060" height="20" fill="url(#shifter-cells)"/>
  <!-- 4 電源：電荷泵、LDO 與高壓穩壓 -->
  <rect x="64" y="358" width="246" height="98" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <g fill="#bbf7d0" stroke="#15803d" stroke-width="1">
    <rect x="120" y="374" width="40" height="30"/><rect x="170" y="374" width="40" height="30"/><rect x="220" y="374" width="40" height="30"/>
    <rect x="120" y="414" width="40" height="30"/><rect x="170" y="414" width="40" height="30"/><rect x="220" y="414" width="76" height="30"/>
  </g>
  <!-- 2 波形查找表（MTP／OTP） -->
  <rect x="320" y="358" width="440" height="98" rx="4" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <rect x="380" y="368" width="368" height="80" fill="url(#lut-cells)"/>
  <!-- 3 時序控制邏輯與介面 -->
  <rect x="770" y="358" width="374" height="98" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <rect x="826" y="370" width="306" height="76" fill="url(#logic-cells)"/>
  <!-- 編號 -->
  <g font-family="IBM Plex Mono, Consolas, monospace" font-size="28" font-weight="700" text-anchor="middle" fill="#0f172a">
    <circle cx="94" cy="252" r="25" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/><text x="94" y="262">1</text>
    <circle cx="350" cy="386" r="25" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/><text x="350" y="396">2</text>
    <circle cx="798" cy="386" r="25" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/><text x="798" y="396">3</text>
    <circle cx="92" cy="386" r="25" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/><text x="92" y="396">4</text>
    <line x1="600" y1="150" x2="600" y2="190" stroke="#0f172a" stroke-width="2"/>
    <circle cx="600" cy="132" r="25" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/><text x="600" y="142">5</text>
  </g>
</svg>
